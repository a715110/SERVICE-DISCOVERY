# =====================================================================
# service-discovery - CLOUD profile (one registry per customer instance)
# Plain HTTP inside the instance's private network; never exposed through the
# public ingress. Every other app points EUREKA_SERVICE_URL here, e.g.
#   EUREKA_SERVICE_URL=http://service-discovery:8761/eureka/
# =====================================================================

eureka.client.service-url.defaultZone=http://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
