# =====================================================================
# service-discovery - LOCAL profile (developer machine only)
# Same address as the previous jar: https://localhost:9443/eureka
# Keystore lives outside the project (shared by all dodaso apps):
#   ${user.home}/.dodaso/certs/dodaso_keystore.p12 (override with DODASO_CERT_DIR)
# =====================================================================

dodaso.local.cert-dir=${DODASO_CERT_DIR:${user.home}/.dodaso/certs}

server.port=9443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=file:${dodaso.local.cert-dir}/dodaso_keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-alias=dodaso-server

eureka.client.service-url.defaultZone=https://localhost:9443/eureka
# Local restarts of individual services should not trigger self-preservation mode
eureka.server.enable-self-preservation=false
