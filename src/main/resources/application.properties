# =====================================================================
# service-discovery (Eureka server) - BASE configuration (all environments)
# Profiles: local = developer machine, cloud = every customer instance.
# =====================================================================

# Name kept from the previous jar
spring.application.name=Eureka
server.port=${SERVER_PORT:8761}
server.servlet.context-path=/

# Standalone registry: it does not register with, or fetch from, itself.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Actuator: health (with liveness/readiness) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# Same log levels as the previous jar
logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF
logging.pattern.level=%5p [${DODASO_CUSTOMER_CODE:local}]
