# =====================================================================
# service-discovery (Eureka server) - BASE configuration (all environments)
# Profiles: local = developer machine, cloud = every customer instance.
# =====================================================================

# Name kept from the previous jar
spring.application.name=Eureka
server.port=${SERVER_PORT:8761}
server.servlet.context-path=/

# Standalone registry: it does not register with, or fetch from, itself.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# DISCOVERY TUNING 2026-10-16: serve registry reads straight from the read-write
# cache. That cache is invalidated on every register, status change and cancel, so
# a new or newly UP instance is visible on the very next client fetch. With the
# default (read-only cache on), the server copied the read-write cache into the
# read-only cache only every 30 s (response-cache-update-interval-ms), which added
# up to 30 s before callers could see a service that had just started.
# Safe for one standalone registry per customer instance with a handful of apps.
eureka.server.use-read-only-response-cache=false

# Actuator: health (with liveness/readiness) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# Same log levels as the previous jar
logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF
logging.pattern.level=%5p [${DODASO_CUSTOMER_CODE:local}]